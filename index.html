<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claim Your Reward</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#f9f9f9;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.container{
text-align:center;
width:100%;
max-width:420px;
padding:20px;
}

h1{
font-size:32px;
font-weight:700;
margin-bottom:10px;
color:#222;
}

.subtitle{
font-size:18px;
color:#666;
margin-bottom:40px;
}

.circle{
width:220px;
height:220px;
margin:auto;
border-radius:50%;
background:linear-gradient(135deg,#ff006e,#ff4d6d);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:30px;
font-weight:bold;
cursor:pointer;
box-shadow:0 15px 40px rgba(255,0,110,.3);
transition:.3s;
animation:pulse 2s infinite;
}

.circle:hover{
transform:scale(1.05);
}

.counter{
margin-top:30px;
font-size:24px;
font-weight:bold;
color:#ff006e;
}

.label{
margin-top:10px;
font-size:18px;
color:#444;
}

.dots{
position:absolute;
width:20px;
height:20px;
border-radius:50%;
opacity:.7;
}

.dot1{
background:#00c2ff;
top:15%;
left:10%;
}

.dot2{
background:#ff006e;
bottom:20%;
left:15%;
}

.dot3{
background:#00e5a8;
top:25%;
right:15%;
}

@keyframes pulse{
0%{transform:scale(1);}
50%{transform:scale(1.05);}
100%{transform:scale(1);}
}

.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.8);
display:none;
justify-content:center;
align-items:center;
}

.popup-box{
background:#fff;
padding:30px;
border-radius:15px;
width:90%;
max-width:350px;
text-align:center;
}

.popup-box h2{
margin-bottom:15px;
}

.popup-box p{
margin-bottom:20px;
}

.claim-btn{
display:inline-block;
padding:15px 35px;
background:#ff006e;
color:white;
text-decoration:none;
border-radius:10px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="dot1 dots"></div>
<div class="dot2 dots"></div>
<div class="dot3 dots"></div>

<div class="container">

<h1>Get Rewards Today</h1>
<p class="subtitle">Answer simple questions and qualify for rewards</p>

<div class="circle" onclick="openOffer()">
TAP
</div>

<div class="label">Participants</div>
<div class="counter" id="counter">267</div>

</div>

<div class="popup" id="popup">
<div class="popup-box">
<h2>Congratulations 🎉</h2>
<p>You have been selected to continue.</p>

<a href="https://ln.run/personal" class="claim-btn">
Continue
</a>

</div>
</div>

<script>

let count = 267;

setInterval(()=>{
count += Math.floor(Math.random()*5);
document.getElementById('counter').innerHTML = count;
},2000);

function openOffer(){
document.getElementById('popup').style.display='flex';
}

</script>

</body>
</html>
